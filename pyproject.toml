[project]
name = "lumen-brain"
version = "0.4.0"
description = "Python SDK for BrainAPI v2"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Christian Nonis", email = "christiannonis@lumen-labs.ai" },
]
requires-python = ">=3.9"
keywords = ["brainapi", "lumen", "memory", "knowledge-graph"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Lumen-Labs/lumen-brain"
Issues = "https://github.com/Lumen-Labs/lumen-brain/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen_brain"]

[tool.hatch.build.targets.sdist]
include = [
    "lumen_brain",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
